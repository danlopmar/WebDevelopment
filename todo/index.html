<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <style>

        label {
            font-size: 18px;
        }

        input:checked + label {
            text-decoration: line-through;
            color: gray;
        }
    </style>

</head>
<body>

<input type="checkbox" id="task1">
<label for="task1"> I have a bike</label><br>

<input type="checkbox" id="task2">
<label for="task2"> I have a car</label><br>

<input type="checkbox" id="task3">
<label for="task3"> I have a boat</label><br>

</body>
</html>
