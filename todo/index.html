<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To Do</title>

    <style>
        label {
            font-size: 18px;
        }

        input:checked + label {
            text-decoration: line-through;
            color: gray;
        }

        .task {
            margin-bottom: 8px;
        }

        .trash {
            margin-left: 10px;
            cursor: pointer;
        }

        .date {
            margin-left: 10px;
            color: blue;
        }
    </style>
</head>

<body>

<input type="text" id="taskInput" placeholder="Enter task">
<input type="date" id="dueDate">
<button onclick="addTask()">Add</button>

<br><br>

<div id="list"></div>

<script>
    function setCookie(cname, cvalue, exdays) {
        const d = new Date();
        d.setTime(d.getTime() + (exdays * 24 * 60 * 60 * 1000));
        let expires = "expires=" + d.toUTCString();
        document.cookie = cname + "=" + cvalue + ";" + expires + ";path=/";
    }

    function getCookie(cname) {
        let name = cname + "=";
        let ca = document.cookie.split(";");

        for (let i = 0; i < ca.length; i++) {
            let c = ca[i].trim();

            if (c.indexOf(name) == 0) {
                return c.substring(name.length, c.length);
            }
        }

        return "";
    }

    function addTask() {
        let taskInput = document.getElementById("taskInput");
        let dueDate = document.getElementById("dueDate");

        let text = taskInput.value;
        let date = dueDate.value;

        if (text == "") return;

        addTaskToPage(text, date);

        let current = getCookie("tasks");
        setCookie("tasks", current + "|" + text + "," + date, 15);

        taskInput.value = "";
        dueDate.value = "";
    }

    function addTaskToPage(text, date) {
        let list = document.getElementById("list");

        let div = document.createElement("div");
        div.className = "task";

        let checkbox = document.createElement("input");
        checkbox.type = "checkbox";

        let label = document.createElement("label");
        label.innerText = " " + text;

        let due = document.createElement("span");
        due.className = "date";
        due.innerText = "Due: " + date;

        let trash = document.createElement("span");
        trash.innerText = "🗑️";
        trash.className = "trash";

        trash.onclick = function () {
            div.remove();
        };

        div.appendChild(checkbox);
        div.appendChild(label);
        div.appendChild(due);
        div.appendChild(trash);

        list.appendChild(div);
    }

    let saved = getCookie("tasks");

    if (saved != "") {
        let tasks = saved.split("|");

        for (let i = 0; i < tasks.length; i++) {
            if (tasks[i] != "") {
                let parts = tasks[i].split(",");
                let text = parts[0];
                let date = parts[1];

                addTaskToPage(text, date);
            }
        }
    }
</script>

</body>
</html>
