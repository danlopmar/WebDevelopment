<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Date Countdown</title>
</head>
<body>

<p>July 17 Countdown</p>
<p id="result"></p>

</body>

<script>

    count();
    setInterval(count,1000);
    function count() {
    let now = new Date();

    let targetDate = new Date("7/17/26 00:00:00");

    let difference = targetDate.getTime() - now.getTime();

    let totalSeconds = Math.floor(Math.abs(difference) / 1000);

    let days = Math.floor(totalSeconds / (60 * 60 * 24));
    let hours = Math.floor((totalSeconds % (60 * 60 * 24)) / (60 * 60));
    let minutes = Math.floor((totalSeconds % (60 * 60)) / 60);
    let seconds = totalSeconds % 60;

    let message = "";

    if (difference > 0) {
        message = "There are " + days + " days, " +  hours + " hours, " +  minutes + " minutes, and " + seconds + " seconds until July 17, 2026.";
    }



    document.getElementById("result").innerHTML = message;
    }
</script>

</html>
